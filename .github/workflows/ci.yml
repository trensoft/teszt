name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse (bash -n)
        run: |
          set -e
          n=0
          while IFS= read -r -d '' f; do bash -n "$f"; n=$((n+1)); done < <(git ls-files -z '*.sh')
          echo "bash -n OK: $n file(s)"
      - name: Python files compile
        run: |
          set -e
          n=0
          while IFS= read -r -d '' f; do python3 -m py_compile "$f"; n=$((n+1)); done < <(git ls-files -z '*.py')
          echo "py_compile OK: $n file(s)"
      - name: Node tests (if any)
        run: |
          if [ -f package.json ]; then npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts; npm test --if-present; else echo "no package.json"; fi
